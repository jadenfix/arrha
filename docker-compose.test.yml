name: aether-compose-e2e

x-validator: &validator
  build:
    context: .
    dockerfile: Dockerfile
  image: aether-node:compose-e2e
  entrypoint: ["/app/scripts/docker-entrypoint.sh"]
  depends_on:
    genesis-init:
      condition: service_completed_successfully
  environment: &validator-environment
    NUM_VALIDATORS: "4"
    AETHER_GENESIS_DIR: /app/data/genesis
    AETHER_GENESIS_PATH: /app/data/genesis/genesis.json
    AETHER_RPC_BIND_IP: 0.0.0.0
    AETHER_RPC_PORT: "8545"
    AETHER_P2P_PORT: "9000"
    RUST_LOG: info
  volumes:
    - genesis-data:/app/data/genesis:ro
  networks:
    - aether-testnet
  healthcheck:
    test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8545/health"]
    interval: 10s
    timeout: 3s
    start_period: 20s
    retries: 3

services:
  genesis-init:
    build:
      context: .
      dockerfile: Dockerfile
    image: aether-node:compose-e2e
    entrypoint: ["sh", "-ec"]
    command:
      - |
        if [ ! -s /app/data/genesis/genesis.json ]; then
          genesis-ceremony --validators 4 --output-dir /app/data/genesis --stake 1000000 --network devnet
        fi
    volumes:
      - genesis-data:/app/data/genesis
    networks:
      - aether-testnet
    restart: "no"

  validator-1:
    <<: *validator
    environment:
      <<: *validator-environment
      VALIDATOR_ID: "1"
      AETHER_VALIDATOR_KEY: /app/data/genesis/validator-1.key
      AETHER_NODE_DB_PATH: /app/data/validator-1
      AETHER_BOOTSTRAP_PEERS: /dns4/validator-2/tcp/9000,/dns4/validator-3/tcp/9000,/dns4/validator-4/tcp/9000
    ports:
      - "8545:8545"
      - "9000:9000"
    volumes:
      - genesis-data:/app/data/genesis:ro
      - validator-1-data:/app/data/validator-1

  validator-2:
    <<: *validator
    environment:
      <<: *validator-environment
      VALIDATOR_ID: "2"
      AETHER_VALIDATOR_KEY: /app/data/genesis/validator-2.key
      AETHER_NODE_DB_PATH: /app/data/validator-2
      AETHER_BOOTSTRAP_PEERS: /dns4/validator-1/tcp/9000,/dns4/validator-3/tcp/9000,/dns4/validator-4/tcp/9000
    ports:
      - "8546:8545"
      - "9001:9000"
    volumes:
      - genesis-data:/app/data/genesis:ro
      - validator-2-data:/app/data/validator-2

  validator-3:
    <<: *validator
    environment:
      <<: *validator-environment
      VALIDATOR_ID: "3"
      AETHER_VALIDATOR_KEY: /app/data/genesis/validator-3.key
      AETHER_NODE_DB_PATH: /app/data/validator-3
      AETHER_BOOTSTRAP_PEERS: /dns4/validator-1/tcp/9000,/dns4/validator-2/tcp/9000,/dns4/validator-4/tcp/9000
    ports:
      - "8547:8545"
      - "9002:9000"
    volumes:
      - genesis-data:/app/data/genesis:ro
      - validator-3-data:/app/data/validator-3

  validator-4:
    <<: *validator
    environment:
      <<: *validator-environment
      VALIDATOR_ID: "4"
      AETHER_VALIDATOR_KEY: /app/data/genesis/validator-4.key
      AETHER_NODE_DB_PATH: /app/data/validator-4
      AETHER_BOOTSTRAP_PEERS: /dns4/validator-1/tcp/9000,/dns4/validator-2/tcp/9000,/dns4/validator-3/tcp/9000
    ports:
      - "8548:8545"
      - "9003:9000"
    volumes:
      - genesis-data:/app/data/genesis:ro
      - validator-4-data:/app/data/validator-4

  test-runner:
    build:
      context: .
      dockerfile: Dockerfile
    image: aether-node:compose-e2e
    entrypoint: ["python3", "/app/scripts/container-e2e.py"]
    depends_on:
      validator-1:
        condition: service_healthy
      validator-2:
        condition: service_healthy
      validator-3:
        condition: service_healthy
      validator-4:
        condition: service_healthy
    networks:
      - aether-testnet

networks:
  aether-testnet:
    driver: bridge

volumes:
  genesis-data:
  validator-1-data:
  validator-2-data:
  validator-3-data:
  validator-4-data:
