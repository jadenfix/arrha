[package]
name = "aether-runtime"
version.workspace = true
edition.workspace = true
description = "Wasmtime-based parallel WASM execution runtime for Aether smart contracts"
categories = ["wasm", "cryptography::cryptocurrencies"]
keywords = ["aether", "wasm", "runtime", "smart-contracts"]

[dependencies]
aether-types = { path = "../types" }
anyhow.workspace = true
wasmtime.workspace = true
sha2 = "0.10"
tracing.workspace = true
rayon = "1"

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }

[[bench]]
name = "scheduler"
harness = false

[lib]
test = false
doctest = false
