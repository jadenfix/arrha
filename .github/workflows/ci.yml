name: Aether CI

on:
  push:
    branches: [main, 'release/**']
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  CARGO_INCREMENTAL: 0

jobs:
  # ──────────────────────────────────────────────
  # Lint: formatting, clippy, and security audit
  # ──────────────────────────────────────────────
  lint:
    name: Lint & Security Audit
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-lint-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-lint-

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Install cargo-audit
        run: cargo install cargo-audit --version 0.22.2 --locked

      - name: Security audit dependencies
        run: cargo audit --deny unsound --deny yanked

  web-build:
    name: Web workspace build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build:web

  # ──────────────────────────────────────────────
  # Build: release binaries for supported targets
  # ──────────────────────────────────────────────
  build:
    name: Build (${{ matrix.target }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        target:
          - x86_64-unknown-linux-gnu
          - aarch64-unknown-linux-gnu
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install ARM64 cross-compiler
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu g++-aarch64-linux-gnu pkg-config

      - name: Configure ARM64 linker
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc" >> $GITHUB_ENV
          echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_AR=aarch64-linux-gnu-ar" >> $GITHUB_ENV
          echo "CC_aarch64_unknown_linux_gnu=aarch64-linux-gnu-gcc" >> $GITHUB_ENV
          echo "AR_aarch64_unknown_linux_gnu=aarch64-linux-gnu-ar" >> $GITHUB_ENV

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-${{ matrix.target }}-build-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-${{ matrix.target }}-build-

      - name: Build release binary
        run: cargo build --release --target ${{ matrix.target }}

  # ──────────────────────────────────────────────
  # Docker: build and validate container image
  # ──────────────────────────────────────────────
  docker:
    name: Docker Compose E2E (4 validators)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build validator and test-runner image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          load: true
          tags: aether-node:compose-e2e
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run shared-genesis container journey
        run: docker compose --project-name aether-ci -f docker-compose.test.yml up --no-build --abort-on-container-exit --exit-code-from test-runner test-runner

      - name: Capture container logs on failure
        if: failure()
        run: docker compose --project-name aether-ci -f docker-compose.test.yml logs --no-color > docker-compose-e2e.log || true

      - name: Upload container logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: docker-compose-e2e-logs
          path: docker-compose-e2e.log

      - name: Stop container journey
        if: always()
        run: docker compose --project-name aether-ci -f docker-compose.test.yml down --volumes --remove-orphans

  # ──────────────────────────────────────────────
  # Integration: in-process e2e tests (no Docker)
  #
  # The e2e tests use an in-process TestNetwork with in-memory message
  # passing between nodes — they do NOT require a running Docker network.
  # Compose is a separate operator asset. The process devnet job below
  # exercises actual local P2P and RPC integration.
  # ──────────────────────────────────────────────
  integration:
    name: In-process E2E
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Restore cargo cache (read-only)
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-integration-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-integration-

      - name: Run multi-node and agent-settlement E2E
        run: ./cli-test --in-process-only

  # ──────────────────────────────────────────────
  # Devnet E2E: 4 validator processes over real libp2p networking.
  # Asserts finality, transfers, WASM deploy/call, QCs, and liveness with one
  # validator killed + catch-up after restart (scripts/e2e-devnet.sh).
  # ──────────────────────────────────────────────
  devnet-e2e:
    name: Devnet E2E (4 validators)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CARGO_PROFILE_RELEASE_LTO: thin
      CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "16"
      AETHER_INDEXER_BIN: target/release/aether-indexer
      AETHER_PYTHON_BIN: python
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install client journey dependencies
        run: |
          npm ci
          npm run build:web
          python -m pip install ./sdks/python

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-devnet-e2e-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-devnet-e2e-

      - name: Build node, genesis ceremony and aetherctl
        run: cargo build --release -p aether-node -p aether-cli -p aether-indexer --bins

      - name: Run devnet E2E
        run: RUN_CLIENT_E2E=1 RUN_INDEXER_E2E=1 SKIP_BUILD=1 KEEP_DEVNET_DATA=1 ./scripts/e2e-devnet.sh

      - name: Recover from a late bootstrap seed and seed restart
        run: KEEP_DEVNET_DATA=1 python scripts/bootstrap-retry-e2e.py

      - name: Upload devnet logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: devnet-e2e-logs
          path: |
            data/e2e-devnet/*.log
            data/bootstrap-e2e-*/*.log
