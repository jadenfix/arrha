[package]
name = "arrha-solana"
version = "0.1.0"
edition = "2021"
license = "MIT"
[lib]
crate-type = ["cdylib"]
[features]
default = []
devnet = []
no-entrypoint = []
no-idl = []
no-log-ix-name = []
cpi = ["no-entrypoint"]
custom-heap = []
custom-panic = []
anchor-debug = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]
[dependencies]
anchor-lang = "=0.32.1"
anchor-spl = { version = "=0.32.1", default-features = false, features = ["token", "associated_token"] }
[workspace]
[profile.release]
overflow-checks = true
lto = "fat"
codegen-units = 1
