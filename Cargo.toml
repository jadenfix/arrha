# Arrha / Aether Rust workspace. See docs/architecture.md for current wiring.

[workspace]
resolver = "2"
exclude = ["fuzz"]

members = [
    # Core protocol stack
    "crates/node",
    "crates/consensus",
    "crates/ledger",
    "crates/runtime",
    "crates/mempool",
    "crates/p2p",
    
    # Networking & data availability
    "crates/networking/quic-transport",
    "crates/networking/gossipsub",
    "crates/da/turbine",
    "crates/da/erasure-coding",
    "crates/da/shreds",
    
    # Cryptography primitives
    "crates/crypto/primitives",
    "crates/crypto/vrf",
    "crates/crypto/bls",
    "crates/crypto/threshold",
    "crates/crypto/pq",
    "crates/crypto/kes",
    "crates/crypto/kzg",
    
    # State & storage
    "crates/state/merkle",
    "crates/state/storage",
    "crates/state/snapshots",
    
    # Native programs (system contracts)
    "crates/programs/staking",
    "crates/programs/governance",
    "crates/programs/amm",
    "crates/programs/job-escrow",
    "crates/programs/agent-run-escrow",
    "crates/programs/reputation",
    "crates/programs/aic-token",
    
    # Verifiers
    "crates/verifiers/tee",
    "crates/verifiers/kzg-verifier",
    "crates/verifiers/vcr-validator",
    
    # RPC & APIs
    "crates/rpc/json-rpc",
    "crates/rpc/grpc-firehose",
    
    # Common types & utilities
    "crates/types",
    "crates/agent-schema",
    "crates/codecs",
    "crates/metrics",
    
    # Light client
    "crates/light-client",

    # MEV mitigation
    "crates/mev",

    # Account abstraction
    "crates/programs/account-abstraction",

    # L2 Rollup
    "crates/rollup",

    # SDKs
    "crates/sdk/rust",
    "crates/sdk/contract",
    
    # Tools
    "crates/tools/cli",
    "crates/tools/keytool",
    "crates/tools/faucet",
    "crates/tools/scorecard",
    "crates/tools/indexer",
    "crates/tools/loadgen",
    
    # AI Mesh
    "ai-mesh/router",
    "ai-mesh/coordinator",
    "ai-mesh/worker",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.86"
license = "MIT"
publish = false
repository = "https://github.com/jadenfix/arrha"

[workspace.dependencies]
# Async runtime
tokio = { version = "1", features = ["full"] }
async-trait = "0.1"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
bincode = "1"
borsh = { version = "1", features = ["derive"] }

# Cryptography
ed25519-dalek = "2"
curve25519-dalek = { version = "4.1.3", features = ["digest"] }
blst = "0.3"
sha2 = "0.10"
blake3 = "1"
rand = "0.8"
zeroize = { version = "1", features = ["derive"] }
subtle = "2"

# Networking
quinn = "0.11"
libp2p = { version = "0.56", default-features = false, features = ["gossipsub", "identify", "kad", "noise", "tcp", "yamux", "macros", "tokio"] }

# Storage
rocksdb = "0.21"

# WASM runtime
wasmtime = "36.0.7"

# Error handling
anyhow = "1"
thiserror = "1"

# Configuration
toml = "0.8"

# Serialization (already defined above)

# Telemetry
tracing = "0.1"
tracing-subscriber = "0.3"
prometheus = "0.14"

# Testing
criterion = { version = "0.5", features = ["html_reports"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"

[profile.bench]
inherits = "release"
debug = true

# Optimize crypto crates even in test builds for realistic perf
[profile.test]
opt-level = 2

[profile.test.package.blst]
opt-level = 3

[profile.test.package.ed25519-dalek]
opt-level = 3

[profile.test.package.sha2]
opt-level = 3

[profile.test.package.blake3]
opt-level = 3
