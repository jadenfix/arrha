replicaCount: 4

image:
  repository: aether-node
  tag: operator-supplied
  pullPolicy: IfNotPresent

# Create these from the same genesis ceremony before installing the chart.
genesis:
  configMapName: aether-genesis
  secretName: validator-keys

resources:
  requests:
    cpu: "4"
    memory: "16Gi"
  limits:
    cpu: "8"
    memory: "32Gi"

storage:
  size: 100Gi
  storageClass: fast-nvme

ports:
  rpc: 8545
  p2p: 9000
  metrics: 9090

network:
  # Must match the headless service used by the StatefulSet peer DNS names.
  headlessServiceName: aether-validator

env:
  RUST_LOG: "info"

affinity:
  podAntiAffinity:
    preferredDuringSchedulingIgnoredDuringExecution:
      - weight: 100
        podAffinityTerm:
          labelSelector:
            matchLabels:
              app: aether-validator
          topologyKey: kubernetes.io/hostname

livenessProbe:
  httpGet:
    path: /health
    port: 8545
  initialDelaySeconds: 30
  periodSeconds: 10

readinessProbe:
  httpGet:
    path: /ready
    port: rpc
  initialDelaySeconds: 10
  periodSeconds: 5
